services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: bookstore-sqlserver
    user: "0:0"
    restart: unless-stopped
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - ACCEPT_EULA=Y
    ports:
      # Nếu vẫn bị timeout, hãy đổi "1433:1433" thành "8888:1433"
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./Backups:/var/opt/mssql/backup

  backend:
    build: ./backend/BookStore.API
    container_name: bookstore-backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
    environment:
      # Kết nối nội bộ Docker dùng tên container 'sqlserver'
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=BookStoreDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./Backups:/app/backups

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: bookstore-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sqlserver_data: