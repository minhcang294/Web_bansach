services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookstore-sqlserver
    environment:
      - SA_PASSWORD=YourStrong!Passw0rd
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./Backups:/var/opt/mssql/backup # 👈 SQL Server sẽ ghi file vào đây

  backend:
    build: ./backend/BookStore.API
    container_name: bookstore-backend
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=BookStoreDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./Backups:/app/backups # 👈 C# sẽ đọc file từ đây

  frontend:
    build:
      context: ./frontend
      args:
            VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: bookstore-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sqlserver_data: